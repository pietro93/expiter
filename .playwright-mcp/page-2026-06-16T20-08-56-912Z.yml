      - paragraph [ref=e122]: About
      - paragraph [ref=e123]:
        - text: Expiter is a data visualization tool for researching and comparing different quality of life factors in Italian cities and provinces.
        - text: We provide valuable information for expats, exchange students, full-time travelers, remote workers and digital nomads who are living in (or planning to move to) Italy.
      - paragraph [ref=e124]: Disclaimer
      - paragraph [ref=e125]:
        - text: The information on this website is for educational purposes only. We collect data from different sources including internal surveys and publicly available databases from external sources.
        - text: Expiter.com does not endorse or guarantee the accuracy, reliability, or completeness of any products, services, or information mentioned on this website.
        - text: Expiter.com participates in affiliate programs, including the Amazon Services LLC Associates Program, an affiliate advertising program designed to provide a means for sites to earn advertising fees by advertising and linking to Amazon.
        - text: This means that we may earn a commission if you click on or purchase products through our links, at no extra cost to you.
