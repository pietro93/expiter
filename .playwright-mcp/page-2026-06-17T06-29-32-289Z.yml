          - generic [ref=e197]:
            - heading "About Agrigento" [level=2] [ref=e198]
            - generic [ref=e199]:
              - paragraph [ref=e200]:
                - generic [ref=e201]:
                  - text: Agrigento is a municipality of 55.636 inhabitants located in the
                  - link "Agrigento province" [ref=e202] [cursor=pointer]:
                    - /url: https://expiter.com/comuni/province-of-agrigento
                - text: in the Italian region of Sicily in Southern Italy.
              - paragraph [ref=e203]: It has a population density of 228pp/km² people per km² and an altitude of 230m metres above the sea level.
              - paragraph [ref=e204]: Agrigento accounts for about 12.79% of the total population in the province of Agrigento and about 0.09233% of the overall population of Italy as of 2022.
              - heading "About Agrigento" [level=3] [ref=e205]
              - text: Bari is the capital of Apulia and a major commercial and cultural center. Some of its landmarks are the Basilica of San Nicola, the Castello Normanno-Svevo, the Petruzzelli Theatre, and the Pinacoteca Provinciale.
              - paragraph
              - paragraph [ref=e206]: Bari also has a lively waterfront, a modern city center, and a historic core, known as Bari Vecchia.
              - paragraph [ref=e207]: Some of the most characteristic aspects of Bari are the cult of Saint Nicholas, the patron saint of the city, the tradition of the orecchiette pasta, and the dialect of the Barese people.
              - paragraph [ref=e208]: Bari was founded by the Peucetians in the 8th century BC. It was conquered by the Romans, the Byzantines, the Lombards, the Saracens, the Normans, the Swabians, the Angevins, the Aragonese, and the Bourbons.
              - paragraph [ref=e209]: Bari was the seat of the Kingdom of Naples, the Kingdom of the Two Sicilies, and the Kingdom of Italy. It was also a strategic port for trade and commerce in the Mediterranean.
              - paragraph [ref=e210]: Bari was bombed by the Allies, liberated by the Polish Army, and rebuilt after World War II. It is now a thriving city and a popular tourist destination.
          - generic [ref=e211]:
            - heading "Climate" [level=2] [ref=e212]
            - generic [ref=e213]:
              - paragraph [ref=e214]: Agrigento is classified as a Climate Zone B, which means it is one of the warmest and sunniest locations in Italy. The local climate is characterized by short, mild winters and long, hot and dry summers. Rainfall is mostly concentrated to the winter period.
              - paragraph [ref=e215]: The province of Agrigento experiences on average 95.21 days of hot temperatures (over 30°C) and 0.00 cold temperature days (<5°C) per year.
              - paragraph [ref=e216]: Precipitation in the form of rain or snow occurs around 70.32 days per year. Fog is rarely an issue, with little to no foggy days throughout the year.
              - paragraph [ref=e217]: The municipality of Agrigento enjoys approximately 9.1 hours of sunshine per day. This means that the town experiences an average of 369.06 sunny days in a year.
